<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" role="img" aria-labelledby="title desc">
  <title id="title">선택 노즐 상세 이미지 플레이스홀더</title>
  <desc id="desc">탭에서 선택한 노즐의 상세 사진을 교체할 영역</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fffaf3"/>
      <stop offset="100%" stop-color="#ead7c2"/>
    </linearGradient>
  </defs>
  <rect width="760" height="640" rx="24" fill="url(#bg)"/>
  <rect x="72" y="92" width="616" height="456" rx="22" fill="#ffffff" opacity=".72"/>
  <g transform="translate(238 150)" fill="#f2e7d8" stroke="#7a5134" stroke-opacity=".3" stroke-width="5">
    <path d="M0 250 C0 126 56 0 142 0 C228 0 284 126 284 250 C284 326 226 370 142 370 C58 370 0 326 0 250Z"/>
    <ellipse cx="142" cy="252" rx="58" ry="34" fill="#fffaf3"/>
  </g>
  <path d="M384 198 C492 166 594 212 622 316" fill="none" stroke="#6f7d68" stroke-width="12" stroke-linecap="round" opacity=".28"/>
  <path d="M300 430 H462" stroke="#b78255" stroke-width="12" stroke-linecap="round" opacity=".28"/>
  <g transform="translate(92 64)">
    <rect width="348" height="78" rx="12" fill="#241b16" opacity=".92"/>
    <text x="24" y="33" fill="#fffaf3" font-family="Pretendard, system-ui, sans-serif" font-size="18" font-weight="800">선택 노즐 상세 사진 교체 영역</text>
    <text x="24" y="58" fill="#ead7c2" font-family="Pretendard, system-ui, sans-serif" font-size="13">접촉부, 깊이감, 실리콘 질감이 보이는 컷</text>
  </g>
  <g transform="translate(94 500)">
    <rect width="572" height="72" rx="12" fill="#fffaf3" stroke="#7a5134" stroke-opacity=".18"/>
    <text x="24" y="31" fill="#7a5134" font-family="Pretendard, system-ui, sans-serif" font-size="17" font-weight="800">각 탭 선택 시 이 영역을 해당 노즐 상세 사진으로 교체</text>
    <text x="24" y="54" fill="#6f625a" font-family="Pretendard, system-ui, sans-serif" font-size="13">기본 1호 · 기본 2호 · 커스텀 1호 · 커스텀 2호 · 커스텀 3호</text>
  </g>
